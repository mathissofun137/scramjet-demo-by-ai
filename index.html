<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Proxy</title>
    <style>
      :root {
        --bg-1: #dfe5eb;
        --bg-2: #edf2f7;
        --chrome: #ebedf1;
        --chrome-strong: #dfe3ea;
        --field: rgba(255,255,255,0.58);
        --text: #1f2227;
        --muted: #58616d;
        --line: rgba(35,40,48,0.09);
        --shadow: rgba(21, 29, 38, 0.18);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .browser {
        width: min(1200px, 94vw);
        min-height: 780px;
        background: rgba(255,255,255,0.42);
        border: 1px solid rgba(105,117,130,0.22);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 30px 70px var(--shadow);
        backdrop-filter: blur(10px);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 64px;
        padding: 0 18px;
        background: linear-gradient(180deg, var(--chrome), var(--chrome-strong));
        border-bottom: 1px solid var(--line);
      }

      .traffic {
        display: flex;
        gap: 8px;
        width: 100px;
        flex-shrink: 0;
      }

      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }

      .dot.red { background: #ef6558; }
      .dot.yellow { background: #f0c74e; }
      .dot.green { background: #62c555; }

      .form-shell {
        flex: 1;
        display: flex;
        justify-content: center;
      }

      .address-form {
        width: min(700px, 100%);
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--field);
        border: 1px solid rgba(126,133,143,0.18);
        border-radius: 18px;
        padding: 0 12px 0 14px;
        height: 38px;
      }

      .padlock {
        font-size: 13px;
        color: var(--muted);
      }

      .address-input {
        flex: 1;
        border: none;
        background: transparent;
        outline: none;
        font-size: 13px;
        color: var(--text);
      }

      .go-btn {
        border: none;
        background: #e8ecf3;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        padding: 7px 12px;
        cursor: pointer;
      }

      .page {
        background: rgba(255,255,255,0.18);
        padding: 16px;
      }

      .proxy-view {
        width: 100%;
        height: calc(780px - 64px - 32px);
        border-radius: 18px;
        overflow: hidden;
        background: white;
        border: 1px solid rgba(120,126,134,0.13);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: white;
      }

      @media (max-width: 700px) {
        body { padding: 12px; }
        .browser { width: 100%; min-height: 660px; }
        .toolbar { gap: 10px; padding: 0 12px; }
        .traffic { width: 72px; }
        .address-form { gap: 8px; }
      }
    </style>
  </head>
  <body>
    <div class="browser" aria-label="Web proxy browser window">
      <div class="toolbar">
        <div class="traffic" aria-hidden="true">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>

        <div class="form-shell">
          <form class="address-form" id="proxyForm">
            <span class="padlock">🔒</span>
            <input id="urlInput" class="address-input" type="text" value="https://example.com" aria-label="Website URL" />
            <button class="go-btn" type="submit">Go</button>
          </form>
        </div>
      </div>

      <div class="page">
        <div class="proxy-view">
          <iframe id="proxyFrame" title="Proxy page"></iframe>
        </div>
      </div>
    </div>

    <script>
      const frame = document.getElementById('proxyFrame');
      const input = document.getElementById('urlInput');

      function loadUrl(url) {
        const safeUrl = url.trim();
        if (!safeUrl) {
          return;
        }

        const proxyUrl = '/proxy?url=' + encodeURIComponent(safeUrl);
        frame.src = proxyUrl;
      }

      document.getElementById('proxyForm').addEventListener('submit', function (event) {
        event.preventDefault();
        loadUrl(input.value);
      });

      loadUrl(input.value);
    </script>
  </body>
</html>
