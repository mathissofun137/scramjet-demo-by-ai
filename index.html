<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jsDelivr Loader Demo</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6fb;
      }
      .wrap {
        max-width: 800px;
        margin: 60px auto;
        padding: 30px;
        background: white;
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      }
      h1 { margin-top: 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>jsDelivr + GitHub Demo</h1>
      <p>This page loads a script from GitHub through jsDelivr.</p>
    </div>

    <script>
      const repoUrl = 'https://cdn.jsdelivr.net/gh/mathissofun137/scramjet-demo-by-ai/script.js?raw';

      fetch(repoUrl)
        .then((response) => {
          if (!response.ok) throw new Error('Script not found');
          return response.text();
        })
        .then((code) => {
          const script = document.createElement('script');
          script.textContent = code;
          document.head.appendChild(script);
        })
        .catch((error) => {
          console.error('Failed to load remote script:', error);
          document.body.insertAdjacentHTML(
            'beforeend',
            '<p style="padding:20px; color:red;">Failed to load remote script.</p>'
          );
        });
    </script>
  </body>
</html>
